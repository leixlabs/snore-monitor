<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snore Monitor Portal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ============================================================== -->
  <!-- Top status bar                                                  -->
  <!-- ============================================================== -->
  <header id="topbar" class="topbar" aria-label="系统状态">
    <div class="topbar-row">
      <h1 class="brand">Snore Monitor</h1>
      <button id="refresh-btn" type="button" class="btn-icon" title="刷新" aria-label="刷新">
        <!-- inline SVG, no external asset -->
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
        </svg>
      </button>
    </div>

    <div id="banner" class="banner banner-hidden" role="alert" aria-live="assertive"></div>

    <div class="pills" id="status-pills">
      <span class="pill" data-key="service">
        <span class="pill-label">服务</span>
        <span class="pill-value" data-bind="value">加载中…</span>
      </span>
      <span class="pill" data-key="microphone">
        <span class="pill-label">麦克风</span>
        <span class="pill-value" data-bind="value">—</span>
      </span>
      <span class="pill" data-key="recording">
        <span class="pill-label">录音</span>
        <span class="pill-value" data-bind="value">—</span>
      </span>
      <span class="pill" data-key="detector">
        <span class="pill-label">检测</span>
        <span class="pill-value" data-bind="value">—</span>
      </span>
      <span class="pill" data-key="capture">
        <span class="pill-label">捕获</span>
        <span class="pill-value" data-bind="value">—</span>
      </span>
    </div>

    <div class="disk">
      <div class="disk-row">
        <span class="disk-label">磁盘</span>
        <span class="disk-value" data-bind="disk-text">—</span>
        <span class="pill" data-key="disk">
          <span class="pill-value" data-bind="value">未知</span>
        </span>
      </div>
      <div class="disk-bar" aria-hidden="true">
        <div class="disk-bar-fill" data-bind="disk-fill" style="width:0%"></div>
      </div>
      <div class="disk-meta" data-bind="disk-meta"></div>
    </div>
  </header>

  <main class="layout">
    <!-- ============================================================ -->
    <!-- Date navigation                                                -->
    <!-- ============================================================ -->
    <nav id="date-nav" class="date-nav" aria-label="日期导航">
      <div class="date-nav-head">
        <h2>日期</h2>
        <button id="today-btn" type="button" class="btn-secondary">今天</button>
      </div>
      <div id="date-list" class="date-list" role="list">
        <div class="state state-loading">加载中…</div>
      </div>
    </nav>

    <!-- ============================================================ -->
    <!-- Day content: timeline, events, player                          -->
    <!-- ============================================================ -->
    <section class="day" aria-label="当日内容">
      <header class="day-head">
        <h2 id="day-title" class="day-title">—</h2>
        <span id="day-summary" class="day-summary"></span>
      </header>

      <!-- Timeline -->
      <section class="card timeline-card" aria-label="时间轴">
        <div class="timeline-head">
          <span class="timeline-title">时间轴</span>
          <span class="timeline-hint" id="timeline-hint"></span>
        </div>
        <div id="timeline-axis" class="timeline-axis" aria-hidden="true"></div>
        <div id="timeline" class="timeline" tabindex="0" aria-label="录音与候选时间轴">
          <div class="state state-loading">时间轴加载中…</div>
        </div>
        <div id="timeline-legend" class="timeline-legend">
          <span class="legend-item"><span class="legend-swatch swatch-coverage"></span>录音覆盖</span>
          <span class="legend-item"><span class="legend-swatch swatch-event"></span>候选事件</span>
          <span class="legend-item"><span class="legend-swatch swatch-gap"></span>缺口</span>
          <span class="legend-item"><span class="legend-swatch swatch-head"></span>播放头</span>
        </div>
      </section>

      <!-- Player -->
      <section class="card player-card" aria-label="播放器">
        <div class="player-row">
          <div class="player-meta">
            <div class="player-event" id="player-event">未选择事件</div>
            <div class="player-segment" id="player-segment"></div>
            <div class="player-status" id="player-status"></div>
          </div>
          <div class="player-controls">
            <button id="review-snore" type="button" class="btn btn-snore" disabled>标记鼾声</button>
            <button id="review-not" type="button" class="btn btn-not" disabled>标记误报</button>
            <button id="review-clear" type="button" class="btn btn-clear" disabled>清除标签</button>
          </div>
        </div>
        <div id="audio-wrap" class="audio-wrap"></div>
      </section>

      <!-- Event list -->
      <section class="card events-card" aria-label="事件列表">
        <div class="events-head">
          <h3>事件</h3>
          <span id="events-count" class="events-count"></span>
        </div>
        <div id="events" class="events">
          <div class="state state-loading">事件加载中…</div>
        </div>
      </section>
    </section>
  </main>

  <div id="retry-modal" class="modal modal-hidden" role="dialog" aria-modal="true" aria-labelledby="retry-title">
    <div class="modal-card">
      <h3 id="retry-title">审核未完成</h3>
      <p id="retry-message" class="modal-body">服务器未接受本次更新，请重试。</p>
      <div class="modal-actions">
        <button id="retry-retry" type="button" class="btn btn-snore">重试</button>
        <button id="retry-cancel" type="button" class="btn btn-clear">取消</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
